name: .NET

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: Build solution
      - name: Build
        run: dotnet build --no-restore

      # Step 5: Run tests
      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Step 6: Login to Azure Container Registry
      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # Step 7: Build Docker image      
      - name: Build Docker image
        run: |
          docker build -f ToDo.API/Dockerfile -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:latest .
      
      # Step 8: Push Docker image to ACR
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.IMAGE_NAME }}:latest
